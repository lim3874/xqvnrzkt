  <script>
    'use strict';


    var data = Array.isArray(window.ARCHIVE_DATA) ? window.ARCHIVE_DATA : [];
    var meta = window.ARCHIVE_META && typeof window.ARCHIVE_META === 'object' ? window.ARCHIVE_META : {};
    var totalCount = Number(meta.total) || data.length;
    var requestTimer = null;
    var requestToken = 0;
    var state = { query:'', category:'', length:'', releaseDate:'', sort:'releaseDate', direction:'desc', page:1, pageSize:25, pageStep:5 };
    var $ = function (id) { return document.getElementById(id); };

    function escapeHtml(value) {
      return String(value == null ? '' : value).replace(/[&<>"']/g, function (ch) {
        return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch];
      });
    }
    function safeUrl(value) {
      var url = String(value || '').trim();
      return /^https?:\/\//i.test(url) ? url : '';
    }
    function itemTags(item) {
      var raw = item && item.tags;
      if (Array.isArray(raw)) return raw.map(function (tag) { return String(tag || '').trim(); }).filter(Boolean);
      return String(raw || '').split(/[,;\n]+/).map(function (tag) { return tag.trim(); }).filter(Boolean);
    }
    var tagCatalog = [];
    function buildTagCatalog() {
      var values = {};
      var source = Array.isArray(window.ARCHIVE_ALL) ? window.ARCHIVE_ALL : [];
      source.forEach(function (item) {
        itemTags(item).forEach(function (tag) {
          var value = String(tag || '').trim();
          var key = value.toLowerCase();
          if (key) values[key] = value;
        });
      });
      tagCatalog = Object.keys(values).sort(function (a, b) {
        return values[a].localeCompare(values[b]);
      }).map(function (key) { return values[key]; });
    }
    function renderTagMenu() {
      var menu = $('tagMenu');
      if (!menu) return;
      var query = String($('query').value || '').trim().replace(/^#/, '').toLowerCase();
      var tags = tagCatalog.filter(function (tag) {
        return !query || tag.toLowerCase().indexOf(query) >= 0;
      }).slice(0, 120);
      menu.innerHTML = tags.map(function (tag) {
        return '<button class="tag-option" type="button" role="option" data-tag="' + escapeHtml(tag) + '">#' + escapeHtml(tag) + '</button>';
      }).join('');
      menu.hidden = tags.length === 0;
    }
    function hideTagMenu() {
      var menu = $('tagMenu');
      if (menu) menu.hidden = true;
    }
    function previewUrl(value) {
      var url = safeUrl(value);
      var idMatch = /[?&]id=([^&]+)/i.exec(url);
      if (idMatch && /drive\.google\.com\/(?:thumbnail|uc|file)/i.test(url)) {
        return 'https://drive.google.com/thumbnail?id=' + encodeURIComponent(idMatch[1]) + '&sz=w600';
      }
      return url;
    }
    function eroscriptsThumbnailUrl(value) {
      var url = safeUrl(value).replace(/\/+$/, '');
      var match = /^(https?:\/\/discuss\.eroscripts\.com\/t\/[^?#]+\/\d+)/i.exec(url);
      return '';
    }
    function displayLink(url, label) {
      var safe = safeUrl(url);
      return safe ? '<a class="link-button" href="' + escapeHtml(safe) + '" target="_blank" rel="noopener noreferrer">' + label + '</a>' : '<span class="link-missing">—</span>';
    }
    function dateValue(value) {
      var text = String(value || '').trim();
      var match = /^(\d{1,2})[\\/\\-](\d{1,2})[\\/\\-](\d{4})$/.exec(text);
      return match ? new Date(Number(match[3]), Number(match[1]) - 1, Number(match[2])).getTime() : 0;
    }
    function lengthValue(value) {
      var match = /^(?:(\d+):)?(\d{1,2}):(\d{2})$/.exec(String(value || '').trim());
      return match ? (Number(match[1] || 0) * 3600 + Number(match[2]) * 60 + Number(match[3])) : 0;
    }
    function lengthBucket(value) {
      var text = String(value || '').trim();
      if (!text || !/^(?:(\d+):)?\d{1,2}:\d{2}$/.test(text)) return '';
      var seconds = lengthValue(text);
      if (seconds <= 120) return '0-2';
      if (seconds <= 300) return '2-5';
      if (seconds <= 600) return '5-10';
      if (seconds <= 1500) return '10-25';
      return '25-plus';
    }
    function fillLengthSelect(select) {
      select.innerHTML = '<option value="">All lengths</option>' +
        '<option value="0-2">0–2 min</option>' +
        '<option value="2-5">2–5 min</option>' +
        '<option value="5-10">5–10 min</option>' +
        '<option value="10-25">10–25 min</option>' +
        '<option value="25-plus">25+ min</option>';
    }
    function dateParts(value) {
      var text = String(value || '').trim();
      var match = /^(\d{1,2})[\\\/\-](\d{1,2})[\\\/\-](\d{4})$/.exec(text);
      return match ? {month: String(Number(match[1])).padStart(2, '0'), year: match[3]} : null;
    }
    function fillReleaseDateSelect(select) {
      var monthNames = ['January','February','March','April','May','June','July','August','September','October','November','December'];
      var years = {};
      (meta.releaseDates || []).forEach(function (value) { var date = dateParts(value); if (date) years[date.year] = true; });
      var values = Object.keys(years).sort(function (a,b) { return Number(b) - Number(a); });
      var options = '<option value="">All release dates</option>';
      values.forEach(function (year) {
        options += '<optgroup label="' + escapeHtml(year) + '">';
        options += '<option value="' + escapeHtml(year) + '">' + escapeHtml(year) + ' — All months</option>';
        var months = {};
        (meta.releaseDates || []).forEach(function (value) { var date = dateParts(value); if (date && date.year === year) months[date.month] = true; });
        Object.keys(months).sort().reverse().forEach(function (month) {
          var value = year + '-' + month;
          options += '<option value="' + value + '">' + escapeHtml(year) + ' — ' + monthNames[Number(month) - 1] + '</option>';
        });
        options += '</optgroup>';
      });
      select.innerHTML = options;
    }
    function uniqueValues(key) {
      if (key === 'category') return (meta.categories || []).slice();
      var values = {};
      data.forEach(function (item) { var value = String(item[key] || '').trim(); if (value) values[value] = true; });
      return Object.keys(values);
    }
    function fillSelect(select, values, label, sortFn) {
      values.sort(sortFn || function (a,b) { return a.localeCompare(b); });
      select.innerHTML = '<option value="">' + label + '</option>' + values.map(function (value) { return '<option value="' + escapeHtml(value) + '">' + escapeHtml(value) + '</option>'; }).join('');
    }
    function filteredRows() {
      return data.slice();
    }
    function totalPagesFor(count) {
      return Math.max(1, Math.ceil(count / state.pageSize));
    }
    function pageNumberMarkup(totalPages) {
      var start = Math.max(1, state.page - 4);
      var end = Math.min(totalPages, state.page + 4);
      var pages = [];
      if (start > 1) { pages.push(1); if (start > 2) pages.push(0); }
      for (var page = start; page <= end; page += 1) pages.push(page);
      if (end < totalPages) { if (end < totalPages - 1) pages.push(0); pages.push(totalPages); }
      return pages.map(function (page) {
        if (page === 0) return '<span class="page-ellipsis" aria-hidden="true">…</span>';
        var current = page === state.page;
        return '<button class="page-number' + (current ? ' current' : '') + '" type="button" data-page="' + page + '" aria-label="Page ' + page + '"' + (current ? ' aria-current="page"' : '') + '>' + String(page).padStart(2, '0') + '</button>';
      }).join('');
    }
    function updatePagination(totalRows) {
      var totalPages = totalPagesFor(totalRows);
      $('pagination').hidden = totalRows === 0 || totalPages <= 1;
      $('firstPage').disabled = state.page <= 1;
      $('prevPage').disabled = state.page <= 1;
      $('nextPage').disabled = state.page >= totalPages;
      $('lastPage').disabled = state.page >= totalPages;
      $('pageNumbers').innerHTML = pageNumberMarkup(totalPages);


    }
    function render() {
      var rows = data.slice(0, state.pageSize);
      var totalPages = totalPagesFor(totalCount);
      state.page = Math.min(Math.max(1, state.page), totalPages);
      $('rows').innerHTML = rows.map(function (item) {
        var category = String(item.category || '');
        var tags = itemTags(item);
        var categoryClass = category.toLowerCase() === 'paid' ? 'paid' : category.toLowerCase() === 'free' ? 'free' : '';
        var esUrl = safeUrl(item.eroscripts);
        var image = 'data:image/gif;base64,R0lGODlhAQABAAD/ACwAAAAAAQABAAACADs=';
        var esAttr = esUrl ? ' data-es-url="' + escapeHtml(esUrl) + '"' : '';
        var titleAttr = ' data-preview-title="' + escapeHtml(item.title || '') + '"';
        var categoryAttr = ' data-preview-category="' + escapeHtml(category) + '"';
        var preview = '<img class="preview" loading="lazy" decoding="async" fetchpriority="low" data-src="' + image + '"' + esAttr + titleAttr + categoryAttr + ' alt="Preview" referrerpolicy="no-referrer">';

          '<td><span class="category-badge ' + categoryClass + '">' + escapeHtml(category || '—') + '</span></td>' +
          '<td>' + preview + '</td>' +
          '<td class="title">' + escapeHtml(item.title || 'Untitled') +
            (tags.length ? '<div class="title-tags">' + tags.slice().sort(function (a, b) { return a.localeCompare(b); }).map(function (tag) { return '<span class="title-tag">#' + escapeHtml(tag) + '</span>'; }).join('') + '</div>' : '') +
          '</td>' +
          '<td class="length"><span class="length-value">' + escapeHtml(item.length || '—') + '</span></td>' +
          '<td>' + displayLink(item.eroscripts, 'Eroscripts') + '</td>' +
          '<td>' + displayLink(item.patreon, 'Patreon') + '</td>' +
          '<td>' + displayLink(item.discord, 'Discord') + '</td>' +
          '<td class="date"><span class="date-value">' + escapeHtml(item.releaseDate || '—') + '</span></td>' +
          '</tr>';
      }).join('');
      $('empty').hidden = totalCount !== 0;
      if (totalCount) {
        var shownStart = (state.page - 1) * state.pageSize + 1;
        var shownEnd = Math.min(shownStart + rows.length - 1, totalCount);
        $('stats').textContent = shownStart + '–' + shownEnd + ' of ' + totalCount + ' scripts';
      } else {
        $('stats').textContent = '0 of 0 scripts';
      }
      document.querySelectorAll('th[data-sort]').forEach(function (header) {
        var marker = header.querySelector('.sort');
        marker.textContent = header.getAttribute('data-sort') === state.sort ? (state.direction === 'asc' ? ' ↑' : ' ↓') : '';
      });
      updatePagination(totalCount);
      alignReleaseDateText();
      alignLengthText();
      observePreviewImages();
      resolveEsPreviews();
    }
    function requestPage(silent) {
      if (!window.google || !google.script || !google.script.run) return;
      var currentToken = ++requestToken;
      if (!silent) {
        $('rows').innerHTML = '<tr><td colspan="8" class="loading-cell">Loading…</td></tr>';
      }
      google.script.run
        .withSuccessHandler(function (result) {
          if (currentToken !== requestToken) return;
          result = result || {};
          var nextData = Array.isArray(result.items) ? result.items : [];
          var nextTotalCount = Number(result.total) || 0;
          var nextPage = Number(result.page) || 1;
          var nextPageSize = Number(result.pageSize) || state.pageSize;

            nextTotalCount === totalCount &&
            nextPage === state.page &&
            nextPageSize === state.pageSize &&
            JSON.stringify(nextData) === JSON.stringify(data);

          state.pageSize = nextPageSize;

        .withFailureHandler(function () {

            $('rows').innerHTML = '';
            $('empty').hidden = false;
            $('stats').textContent = 'Unable to load scripts';
            updatePagination(0);
          }
        })
        .getLibraryPage({
          page: state.page,
          pageSize: state.pageSize,
          query: state.query,
          category: state.category,
          length: state.length,
          releaseDate: state.releaseDate,
          sort: state.sort,
          direction: state.direction
        });
    }
    function schedulePageRequest() {
      window.clearTimeout(requestTimer);
      requestTimer = window.setTimeout(requestPage, 250);
    }
    function alignReleaseDateText() {
      var heading = document.querySelector('thead th:nth-child(8) .date-heading');
      if (!heading) return;
      var targetRight = heading.getBoundingClientRect().right;
      document.querySelectorAll('tbody td:nth-child(8) .date-value').forEach(function (value) {
        var delta = targetRight - value.getBoundingClientRect().right;
        value.style.transform = 'translateX(' + delta.toFixed(2) + 'px)';
      });
    }
    function alignLengthText() {
      var heading = document.querySelector('thead th:nth-child(4) .length-heading');
      if (!heading || !heading.firstChild || !heading.firstChild.textContent) return;
      var headingRange = document.createRange();
      var headingText = heading.firstChild;
      headingRange.setStart(headingText, headingText.textContent.length - 1);
      headingRange.setEnd(headingText, headingText.textContent.length);
      var targetRight = headingRange.getBoundingClientRect().right;
      document.querySelectorAll('tbody td:nth-child(4) .length-value').forEach(function (value) {
        var text = value.firstChild;
        if (!text || !text.textContent) return;
        var range = document.createRange();
        range.setStart(text, text.textContent.length - 1);
        range.setEnd(text, text.textContent.length);
        var delta = targetRight - range.getBoundingClientRect().right;
        value.style.transform = 'translateX(' + delta.toFixed(2) + 'px)';
      });
    }
    var previewObserver = window.IntersectionObserver ? new IntersectionObserver(function(entries) {
      entries.forEach(function(entry) {
        if (!entry.isIntersecting) return;

        var src = img.getAttribute('data-src');
        if (src) { img.src = src; img.removeAttribute('data-src'); }
        previewObserver.unobserve(img);
      });
    }, {rootMargin:'150px'}) : null;
    function observePreviewImages() {
      if (previewObserver) previewObserver.disconnect();

        if (previewObserver) previewObserver.observe(img);
        else { img.src = img.getAttribute('data-src'); img.removeAttribute('data-src'); }
      });
    }

    function resolveEsPreviews() {
      if (!window.google || !google.script || !google.script.run) return;
      var images = Array.prototype.slice.call(document.querySelectorAll('img.preview[data-preview-title]'))
        .filter(function (img) { return img.getAttribute('data-es-resolving') !== '1' && img.getAttribute('data-es-resolved') !== '1' && !/^https:\/\/lh3\.googleusercontent\.com\/d\//i.test(img.getAttribute('data-src') || img.src || ''); });

            esUrl: img.getAttribute('data-es-url') || '',

          .withSuccessHandler(function (resolvedUrls) {

    function setTheme(mode) {

    document.addEventListener('click', function (event) {

    });
    $('category').addEventListener('change', function (event) { state.category = event.target.value; state.page = 1; requestPage(); });
    $('length').addEventListener('change', function (event) { state.length = event.target.value; state.page = 1; requestPage(); });
    $('releaseDate').addEventListener('change', function (event) { state.releaseDate = event.target.value; state.page = 1; requestPage(); });
    $('reset').addEventListener('click', function () { state.query = ''; state.category = ''; state.length = ''; state.releaseDate = ''; state.page = 1; state.pageSize = 25; state.pageStep = 5; $('query').value = ''; $('category').value = ''; $('length').value = ''; $('releaseDate').value = ''; $('pageSize').value = '25'; $('pageStep').value = '5'; requestPage(); });
    document.querySelectorAll('th[data-sort]').forEach(function (header) { header.addEventListener('click', function () { var key = header.getAttribute('data-sort'); if (state.sort === key) state.direction = state.direction === 'asc' ? 'desc' : 'asc'; else { state.sort = key; state.direction = 'asc'; } state.page = 1; requestPage(); }); });
    $('pageSize').addEventListener('change', function (event) { state.pageSize = Number(event.target.value) || 25; state.page = 1; requestPage(); });
    $('pageNumbers').addEventListener('click', function (event) { var button = event.target.closest('button[data-page]'); if (button) { state.page = Number(button.getAttribute('data-page')) || 1; requestPage(); } });
    $('pageStep').addEventListener('input', function (event) { var value = Math.floor(Number(event.target.value)); state.pageStep = Number.isFinite(value) && value > 0 ? value : 1; });
    $('firstPage').addEventListener('click', function () { state.page = 1; requestPage(); });

      var targetPage = Math.floor(Number($('pageStep').value));

    $('themeToggle').addEventListener('click', function () { setTheme(document.documentElement.classList.contains('dark') ? 'light' : 'dark'); });

    var tableShell = document.querySelector('.table-shell');

    window.addEventListener('scroll', syncStickyCorners, { passive:true });

  </script>
