name: Refresh and publish archive

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '3,13,23,33,43,53 * * * *'

permissions:
  contents: read

concurrency:
  group: archive-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build fresh public snapshot
        run: node scripts/build-pages.mjs
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 8
    environment: github-pages
    permissions:
      actions: read
      pages: write
      id-token: write
    steps:
      - name: Wait for uploaded Pages artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for attempt in {1..10}; do
            if gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts?name=github-pages" \
              --jq '.artifacts[] | select(.expired == false) | .id' | grep -q .; then
              exit 0
            fi
            sleep 5
          done
          echo "::error::The uploaded Pages artifact did not become available."
          exit 1
      - uses: actions/deploy-pages@v4
